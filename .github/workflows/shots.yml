name: Sanad screenshots

# Real in-app screenshots of Sanad + Sanad Admin on an x86_64 API 34 emulator.
# Trigger: manual dispatch only (uploading APKs no longer auto-runs). 6 parallel shards, one emulator each.
# Output: artifact "shots" (PNGs + crashes.txt + logs) and the same files force-pushed to branch "shots".
# Nothing here publishes anything.

on:
  workflow_dispatch:
    inputs:
      deeplink:
        description: 'Use the app''s --es screen <id> extra instead of tapping (needs the screen hook in MainActivity)'
        type: boolean
        default: false
      only:
        description: 'Optional regex: capture only screens.txt lines whose name matches (rerun of a few screens)'
        type: string
        default: ''

concurrency:
  group: shots
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift /usr/local/share/powershell /opt/hostedtoolcache/CodeQL || true
          df -h /

      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm

      - name: Run emulator, install, walk screens
        id: emu
        continue-on-error: true
        timeout-minutes: 60
        uses: reactivecircus/android-emulator-runner@v2
        env:
          DEEPLINK: ${{ inputs.deeplink && '1' || '0' }}
          SHARD: ${{ matrix.shard }}
          SHARDS: 6
          ONLY: ${{ inputs.only }}
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disk-size: 6000M
          cores: 4
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          # ar-EG is set inside ci/run.sh (setprop + zygote restart): -change-locale restarted the framework while the
          # action was still sending its post-boot keyevent, which failed 3 of 6 shards in run 38724225111 (6.0).
          script: bash ci/run.sh

      - name: Status
        if: always()
        run: |
          mkdir -p shots
          echo "emulator step: ${{ steps.emu.outcome }} shard ${{ matrix.shard }}" > shots/status.txt
          echo "commit: ${{ github.sha }}  run: ${{ github.run_id }}" >> shots/status.txt
          ls -la shots

      - name: Upload artifact "shots"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shots-${{ matrix.shard }}
          retention-days: 7
          path: shots/

      - name: Push screenshots to branch "shots"
        if: always()
        run: |
          [ -d shots ] || exit 0
          cd shots
          git init -q -b shots
          git config user.name "sanad-ci"; git config user.email "sanad-ci@users.noreply.github.com"
          git add -A
          git commit -qm "shots from ${{ github.sha }} (run ${{ github.run_id }})" || exit 0
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" shots:shots-${{ matrix.shard }}

      - name: Fail if emulator step failed
        if: steps.emu.outcome != 'success'
        run: exit 1
